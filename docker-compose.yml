# FAE-v2 local stack (Phase 1.1 scaffold).
# Heavy real models (GPU ASR / Letta) are stubbed so all 6 services can
# become healthy without a GPU. Swap stub images for real ones later.
#
# Usage:
#   ./deploy/scripts/setup.sh
#   ./deploy/scripts/start.sh
#   curl http://localhost:8000/health

services:
  backend:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    ports:
      - "8000:8000"
    # Created by deploy/scripts/setup.sh; optional so `compose build` works fresh.
    env_file:
      - path: .env
        required: false
    environment:
      LETTA_SERVER_URL: http://letta:8283
      VLLM_ASR_URL: http://vllm-asr:8000
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
    depends_on:
      letta:
        condition: service_healthy
      vllm-asr:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  ui:
    build:
      context: .
      dockerfile: deploy/docker/ui.Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  letta:
    build:
      context: .
      dockerfile: deploy/docker/letta.Dockerfile
    ports:
      - "8283:8283"

  vllm-asr:
    build:
      context: .
      dockerfile: deploy/docker/vllm-asr.Dockerfile
    ports:
      - "8001:8000"

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    # Official image has no curl/wget; treat start as ready for Phase 1.1.

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  qdrant-data:
