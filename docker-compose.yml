# FAE-v2 local stack.
# ASR remains a stub (no GPU). Letta uses the official image with Postgres volume.
#
# Usage:
#   ./deploy/scripts/setup.sh
#   ./deploy/scripts/start.sh
#   curl http://localhost:8000/health
#
# Offline Letta fallback (no Docker pull): set backend LETTA_MODE=embedded

services:
  backend:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    ports:
      - "8000:8000"
    # Created by deploy/scripts/setup.sh; optional so `compose build` works fresh.
    env_file:
      - path: .env
        required: false
    environment:
      LETTA_MODE: remote
      LETTA_SERVER_URL: http://letta:8283
      LETTA_AGENT_NAME: fae-main
      VLLM_ASR_URL: http://vllm-asr:8000
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
    depends_on:
      letta:
        condition: service_healthy
      vllm-asr:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  ui:
    build:
      context: .
      dockerfile: deploy/docker/ui.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 30s

  letta:
    image: letta/letta:latest
    ports:
      - "8283:8283"
    volumes:
      # Official Letta Docker persists via Postgres (not SQLite).
      - letta-data:/var/lib/postgresql/data
    environment:
      # Letta may use these for embeddings / internal tools; FAE chat still uses per-request keys.
      OPENAI_API_KEY: ${DASHSCOPE_API_KEY:-${OPENAI_API_KEY:-}}
      OPENAI_API_BASE: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8283/v1/health')\" || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  # Offline / CI fallback: `docker compose --profile stub-letta up`
  # (does not satisfy M2-1 persistence — use official letta or LETTA_MODE=embedded)
  letta-stub:
    profiles: ["stub-letta"]
    build:
      context: .
      dockerfile: deploy/docker/letta.Dockerfile
    ports:
      - "8283:8283"

  vllm-asr:
    build:
      context: .
      dockerfile: deploy/docker/vllm-asr.Dockerfile
    ports:
      - "8001:8000"

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    # Official image has no curl/wget; treat start as ready for Phase 1.1.

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  qdrant-data:
  letta-data:
