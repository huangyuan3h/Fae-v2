<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FAE-v2</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1419;
        --fg: #e7ecf1;
        --muted: #8b98a5;
        --accent: #5b8def;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background:
          radial-gradient(1200px 600px at 20% 0%, #1a2740 0%, transparent 60%),
          var(--bg);
        color: var(--fg);
      }
      main { max-width: 36rem; padding: 2rem; text-align: center; }
      h1 { font-size: 2.5rem; letter-spacing: 0.08em; margin: 0 0 0.5rem; }
      p { color: var(--muted); line-height: 1.6; }
      code {
        color: var(--accent);
        background: rgba(91, 141, 239, 0.12);
        padding: 0.1rem 0.35rem;
        border-radius: 0.25rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>FAE</h1>
      <p>
        UI placeholder for Phase 1.1. The real VoiceOrb experience lands in
        Phase 1.4. Backend is at <code>http://localhost:8000</code>.
      </p>
    </main>
  </body>
</html>
